name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            pkg-config \
            fonts-dejavu-core

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and Svelte diagnostics
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests (Ubuntu/Windows, anota el fallo)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "FAILED|panicked|test result" test.log | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $status
          fi

      - name: Rust tests
        if: matrix.os == 'macos-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Rust check (all targets)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

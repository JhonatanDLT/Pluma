[package]
name = "pluma"
version = "1.0.0"
description = "Editor de narrativa literaria (novelas y relatos)"
authors = ["Pluma"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pluma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-dialog = "2.8.3"
pdf-extract = "0.12.1"
pulldown-cmark = "0.13.5"
docx-rs = "0.4.22"
genpdf = { version = "0.2.0", features = ["images"] }
image = "0.23"
base64 = "0.22"
strsim = "0.11.1"
unicode-normalization = "0.1"
zip = "9.0.5"
roxmltree = "0.21.1"
fastembed = "6.1.0"
gliner2-rs = { version = "0.9.6", default-features = false, features = ["hub"] }
ureq = "2"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
spellbook = "0.4"
whatlang = "0.18"
keyring = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
